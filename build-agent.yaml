apiVersion: v1
kind: Pod
metadata:
  labels:
    app: spring-build-ci
spec:
  containers:
    - name: maven
      image: maven:3.9.6-eclipse-temurin-17-alpine
      command:
        - cat
      tty: true
      volumeMounts:
        - name: m2
          mountPath: /root/.m2/
    - name: kaniko
      image: gcr.io/kaniko-project/executor:v1.6.0-debug
      imagePullPolicy: Always
      env:
        - name: container
          value: docker
      command:
        - sleep
      args:
        - 99d
      volumeMounts:
        - name: jenkins-docker-cfg
          mountPath: /kaniko/.docker
    - name: trufflehog
      image: rmkanda/trufflehog
      command:
        - cat
      tty: true
    - name: licensefinder
      image: licensefinder/license_finder
      command:
        - cat
      tty: true
    - name: slscan
      image: shiftleft/sast-scan:v2.1.2
      imagePullPolicy: Always
      command:
        - cat
      tty: true
    - name: trivy
      image: aquasec/trivy:latest
      command:
          - cat
      tty: true
    - name: dockle
      image: goodwithtech/dockle:latest
      command:
        - cat
      tty: true
    - name: argocd
      image: quay.io/argoproj/argocd:latest
      command:
        - cat
      tty: true
    - name: zap
      image: ghcr.io/zaproxy/zaproxy:stable
      command:
        - cat
      tty: true
      securityContext:
        runAsUser: 0
  volumes:
    - name: m2
      hostPath:
        path: /tmp/.m2/
    - name: jenkins-docker-cfg
      projected:
        sources:
          - secret:
              name: regcred
              items:
                - key: .dockerconfigjson
                  path: config.json
